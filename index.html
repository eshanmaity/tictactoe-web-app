<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>Premium Tic Tac Toe</title>

    <link rel="preconnect"
        href="https://fonts.googleapis.com">

    <link rel="preconnect"
        href="https://fonts.gstatic.com"
        crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap"
        rel="stylesheet">

    <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">

    <link rel="stylesheet"
        href="style.css">

</head>

<body>

    <div class="bg1"></div>
    <div class="bg2"></div>

    <div class="container">

        <div class="header">

            <h1>TIC TAC TOE</h1>


        </div>

        <div class="top-controls">

            <select id="mode">

                <option value="pvp">
                    Player vs Player
                </option>

                <option value="ai">
                    Player vs AI
                </option>

            </select>

            <select id="difficulty">

                <option value="easy">
                    Easy AI
                </option>

                <option value="medium">
                    Medium AI
                </option>

                <option value="hard">
                    Hard AI
                </option>

            </select>

        </div>

        <div
            id="turn"
            class="turn">

            Player X's Turn

        </div>

        <div
            class="board"
            id="board">

            <div class="cell" data-index="0"></div>
            <div class="cell" data-index="1"></div>
            <div class="cell" data-index="2"></div>

            <div class="cell" data-index="3"></div>
            <div class="cell" data-index="4"></div>
            <div class="cell" data-index="5"></div>

            <div class="cell" data-index="6"></div>
            <div class="cell" data-index="7"></div>
            <div class="cell" data-index="8"></div>

        </div>

        <div
            id="result"
            class="result">

            Let's Play!

        </div>

        <div class="buttons">

            <button id="restart">

                <i class="fa-solid fa-rotate-right"></i>

                Restart

            </button>

            <button id="newGame">

                <i class="fa-solid fa-plus"></i>

                New Game

            </button>

        </div>

        <div class="scoreboard">

            <div class="score-card">

                <h3>X Wins</h3>

                <span id="xScore">0</span>

            </div>

            <div class="score-card">

                <h3>Draws</h3>

                <span id="drawScore">0</span>

            </div>

            <div class="score-card">

                <h3>O Wins</h3>

                <span id="oScore">0</span>

            </div>

        </div>

        <div class="history">

            <h2>

                <i class="fa-solid fa-clock-rotate-left"></i>

                Move History

            </h2>

            <ul id="historyList"></ul>

        </div>

    </div>

    <canvas id="confetti"></canvas>

    <audio id="clickSound">
        <source src="assets/click.mp3" type="audio/mpeg">
    </audio>

    <audio id="winSound">
        <source src="assets/win.mp3" type="audio/mpeg">
    </audio>

    <audio id="drawSound">
        <source src="assets/draw.mp3" type="audio/mpeg">
    </audio>

    <script src="script.js"></script>

</body>

</html>
